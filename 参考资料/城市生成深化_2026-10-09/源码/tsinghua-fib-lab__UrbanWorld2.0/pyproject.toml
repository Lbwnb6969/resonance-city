[project]
name = "urbanworld"
version = "0.1.0"
description = "Automated pipeline for generating textured 3D urban scenes from OpenStreetMap data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "UrbanNewWorld Team"}
]

dependencies = [
    "requests>=2.28",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "tqdm>=4.60",
    "numpy>=1.21",
    "pandas>=1.5",
    "click>=8.0",
]

[project.optional-dependencies]
eval-image = [
    "scikit-image>=0.20",
    "scipy>=1.10",
    "opencv-python>=4.7",
    "torch>=2.0",
    "torchvision==0.20.1",
    "lpips>=0.1.4",
    "torchmetrics>=1.3",
    "torch-fidelity>=0.3",
    "clip @ git+https://github.com/openai/CLIP.git",
]
eval-video = [
    "torch>=2.0",
    "torchvision==0.20.1",
    "opencv-python>=4.7",
    "clip @ git+https://github.com/openai/CLIP.git",
]
eval-shape = [
    "torch>=2.0",
    "torchvision==0.20.1",
    "trimesh>=3.20",
    "open-clip-torch>=2.24",
    "timm>=0.9",
    "easydict>=1.10",
]
osm = [
    "geopandas>=0.12",
    "pyproj>=3.4",
    "lxml>=4.9",
]
streetview = [
    "opencv-python>=4.7",
    "streetlevel>=0.12",
    "loguru>=0.7",
    "bd09convertor>=0.0.3",
]
vlm = [
    "openai>=1.0",
]
detection = [
    "torch>=2.0",
    "transformers>=4.30",
]
mesh = [
    "trimesh>=3.20",
    "torch>=2.0",
    "transformers>=4.30",
    "safetensors>=0.3",
]
catalog = [
    "openpyxl>=3.0",
]
env-road = [
    "mosstool>=1.3.20",
    "pycityproto>=2.0.7,<3.0.0",
    "pyproj>=3.4",
    "shapely>=2.0",
    "protobuf>=4.0",
]
env-parcel = [
    "geopandas>=0.12",
    "shapely>=2.0",
    "pyproj>=3.4",
]
env-tree = [
    "rasterio>=1.3",
    "pyproj>=3.4",
    "opensimplex>=0.4",
]
env = [
    "urbanworld[env-road,env-parcel,env-tree]",
]
all = [
    "urbanworld[osm,streetview,vlm,detection,mesh,catalog,env]",
]

[project.scripts]
urbanworld = "urbanworld.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/urbanworld"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.ruff]
line-length = 120
target-version = "py311"
